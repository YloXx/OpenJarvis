# NVIDIA GPU override — use with:
#   ./install.sh --gpu nvidia
# or:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.nvidia.yml up -d --build
# Requires the NVIDIA Container Toolkit on the host.

services:
  jarvis:
    # Separate tag so CPU and CUDA builds never overwrite each other.
    image: ${OPENJARVIS_IMAGE:-openjarvis:local-cuda}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.gpu
    volumes:
      - /proc:/proc:ro
      - /sys:/sys:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ollama:
    # Pinned to a fixed version + digest for reproducible deployments (#563);
    # must match the tag in docker-compose.yml.
    image: ollama/ollama:0.30.10@sha256:bfc9c6d53cc6989aa5131a6fde6b162b2802d4d337657f3253b5f69579bddeee
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
