# ROCm GPU override — use with:
#   ./install.sh --gpu rocm
# or:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.rocm.yml up -d --build

services:
  jarvis:
    # Separate tag so CPU and ROCm builds never overwrite each other.
    image: ${OPENJARVIS_IMAGE:-openjarvis:local-rocm}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.gpu.rocm
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
      - render
